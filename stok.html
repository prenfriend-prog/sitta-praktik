<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Bahan Ajar - SITTA UT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-ut shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="dashboard.html">SITTA UT</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" href="stok.html">Stok Bahan Ajar</a>
                    <a class="nav-link" href="tracking.html">Tracking DO</a>
                </div>
            </div>
        </nav>

        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manajemen Stok Bahan Ajar SITTA UT</h2>
                <span class="badge bg-primary fs-6">Tugas Praktik 3</span>
            </div>

            <div v-if="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
                {{ successMessage }}
                <button type="button" class="btn-close" @click="successMessage = ''"></button>
            </div>

            <div class="card p-3 mb-4 shadow-sm border-0 bg-light">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Filter UT Daerah</label>
                        <select v-model="filterUPBJJ" class="form-select">
                            <option value="">-- Semua UT Daerah --</option>
                            <option v-for="(upbjj, index) in upbjjOptions" :key="index" :value="upbjj">{{ upbjj }}</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Filter Kategori</label>
                        <select v-model="filterKategori" class="form-select" :disabled="!filterUPBJJ">
                            <option value="">-- Semua Kategori --</option>
                            <option v-for="kat in kategoriOptions" :key="kat" :value="kat">{{ kat }}</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Urutkan (Sorting)</label>
                        <select v-model="sortBy" class="form-select">
                            <option value="az">Judul A-Z</option>
                            <option value="za">Judul Z-A</option>
                            <option value="asc">Stok Terkecil</option>
                            <option value="desc">Stok Terbesar</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" v-model="showCritical" id="criticalCheck">
                            <label class="form-check-label fw-bold text-danger" for="criticalCheck">Stok Kritis / Habis</label>
                        </div>
                    </div>
                </div>
                <div class="mt-3 d-flex justify-content-between">
                    <button class="btn btn-outline-secondary btn-sm" @click="resetFilter">Reset Filter</button>
                    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Tambah Bahan Ajar</button>
                </div>
            </div>

            <div class="card p-3 shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Kode</th>
                                <th>Judul / Catatan</th>
                                <th>Kategori</th>
                                <th>UT Daerah</th>
                                <th>Rak</th>
                                <th>Qty / Safety</th>
                                <th>Harga</th>
                                <th>Status</th>
                                <th>Aksi (Edit & Hapus)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-if="filteredStok.length === 0">
                                <td colspan="9" class="text-center text-muted py-4">
                                    <em>Data stok bahan ajar tidak ditemukan sesuai filter.</em>
                                </td>
                            </tr>
                            <tr is="vue:stok-item" 
                                v-for="item in filteredStok" 
                                :key="item.kode" 
                                :item="item" 
                                @edit-item="handleEditItem"
                                @delete-item="handleDeleteItem">
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="addModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Tambah Bahan Ajar Baru</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div v-if="errorMessage" class="alert alert-danger" v-text="errorMessage"></div>
                        <form @submit.prevent="addItem" @keydown.enter.prevent="addItem">
                            <div class="mb-3">
                                <label class="form-label">Kode Buku</label>
                                <input type="text" class="form-control" v-model.trim="newItem.kode" placeholder="Misal: EKMA4116">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Judul Buku</label>
                                <input type="text" class="form-control" v-model.trim="newItem.judul" placeholder="Misal: Pengantar Manajemen">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Kategori</label>
                                <select class="form-select" v-model="newItem.kategori">
                                    <option value="">-- Pilih Kategori --</option>
                                    <option v-for="kat in kategoriOptions" :key="kat" :value="kat">{{ kat }}</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">UT Daerah</label>
                                <select class="form-select" v-model="newItem.upbjj">
                                    <option value="">-- Pilih UT Daerah --</option>
                                    <option v-for="upbjj in upbjjOptions" :key="upbjj" :value="upbjj">{{ upbjj }}</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Lokasi Rak</label>
                                <input type="text" class="form-control" v-model.trim="newItem.lokasiRak" placeholder="Misal: R1-A3">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Harga (Rp)</label>
                                <input type="number" class="form-control" v-model.number="newItem.harga" placeholder="0">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Qty Stok</label>
                                    <input type="number" class="form-control" v-model.number="newItem.qty" placeholder="0">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Safety Stock</label>
                                    <input type="number" class="form-control" v-model.number="newItem.safety" placeholder="0">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Catatan (HTML Tag)</label>
                                <input type="text" class="form-control" v-model="newItem.catatanHTML" placeholder="Misal: <em>Edisi Revisi</em>">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Simpan Bahan Ajar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/dataBahanAjar.js"></script>
    <script src="js/stok-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
